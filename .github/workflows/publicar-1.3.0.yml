name: Publicar actualización 1.3.0
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publicar-1.3.0.yml
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar instalador compilado
        env:
          PACKAGE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-fbb4-81f4-bd43-739a5389a4b0/raw?se=2026-09-19T11%3A53%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=01a0b97e-551f-7151-9dbc-4dbfd9ac9f9e&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T10%3A01%3A01Z&ske=2026-09-20T10%3A01%3A01Z&sks=b&skv=2026-02-06&sig=HIRJ3W9w11wtH10gcwNFEX4c1ITPCy8Ij/yvrhxEEbQ%3D'
        run: |
          curl -fL "$PACKAGE_URL" -o paquete.zip
          mkdir -p compilado
          unzip -j paquete.zip '*.exe' -d compilado
      - name: Preparar canal verificado
        run: |
          mkdir -p releases/1.3.0
          split -b 524288 -d -a 3 --additional-suffix=.bin compilado/Las-Ninfas-Gestion-Instalador-1.3.0.exe releases/1.3.0/part-
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          installer=Path('compilado/Las-Ninfas-Gestion-Instalador-1.3.0.exe')
          parts=sorted(Path('releases/1.3.0').glob('part-*.bin'))
          manifest={
            'version':'1.3.0',
            'publishedAt':'2026-09-19T10:00:00Z',
            'notes':'Nuevo icono de Las Ninfas, acceso directo corregido y canal de actualizaciones automáticas.',
            'sha256':hashlib.sha256(installer.read_bytes()).hexdigest(),
            'size':installer.stat().st_size,
            'parts':[{'file':str(p).replace('\\','/')} for p in parts]
          }
          Path('manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publicar archivos
        run: |
          git config user.name "Las Ninfas Actualizaciones"
          git config user.email "peluquerialasninfas@gmail.com"
          git add manifest.json releases/1.3.0
          git commit -m "Publicar actualización 1.3.0"
          git push
